# Weekly: collect the Nextcloud client's "Pause sync" / "Resume sync" labels in
# every language and open a pull request when they changed.
name: Update translations

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Nextcloud client's translations
        uses: actions/checkout@v4
        with:
          repository: nextcloud/desktop
          path: upstream
          sparse-checkout: translations
          persist-credentials: false

      - name: Extract the pause and resume labels
        id: extract
        run: |
          python3 -I tools/extract-translations.py upstream/translations > translations.json
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf upstream

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-translations
          commit-message: Update translations from nextcloud/desktop
          title: Update translations from nextcloud/desktop
          body: |
            Pause and resume labels from [nextcloud/desktop@${{ steps.extract.outputs.sha }}](https://github.com/nextcloud/desktop/tree/${{ steps.extract.outputs.sha }}/translations), made by `tools/extract-translations.py`.

            Merge, then tag a release to ship it.
          add-paths: translations.json
          delete-branch: true
